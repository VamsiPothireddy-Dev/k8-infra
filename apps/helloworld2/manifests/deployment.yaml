---
# Source: services/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld2-deployment  # Generalized name based on appName from values.yaml
  labels:
    helm.sh/chart: services-0.1.0
    app.kubernetes.io/name: services
    app.kubernetes.io/instance: helloworld2
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helloworld2  # Use appName from values.yaml
  template:
    metadata:
      labels:
        app: helloworld2  # Use appName from values.yaml
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: helloworld2  # Use appName from values.yaml
        image: "vamsipothireddy/helloworld2:e9de8643658c8e5365580b115917aed936fd6c39"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
          - name: IMAGE_TAG
            value: "e9de8643658c8e5365580b115917aed936fd6c39"


