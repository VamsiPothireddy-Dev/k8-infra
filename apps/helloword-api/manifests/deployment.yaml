---
# Source: services/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloword-api-deployment  # Generalized name based on appName from values.yaml
  labels:
    helm.sh/chart: services-0.1.0
    app.kubernetes.io/name: services
    app.kubernetes.io/instance: helloword-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helloword-api  # Use appName from values.yaml
  template:
    metadata:
      labels:
        app: helloword-api  # Use appName from values.yaml
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: helloword-api  # Use appName from values.yaml
        image: "vamsipothireddy/helloword-api:ae16a106a05b2ab717586b0734891a08007ca7d5"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
          - name: IMAGE_TAG
            value: "ae16a106a05b2ab717586b0734891a08007ca7d5"


