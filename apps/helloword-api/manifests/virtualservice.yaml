---
# Source: services/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: helloword-api-virtualservice
spec:
  hosts:
    - "api.vamsipothireddy.com"
  gateways:
    - "istio-system/ingressgateway"
  http:
    - name: default
      match:
        - uri:
            exact: "/helloword-api"
        - uri:
            prefix: "/helloword-api/"
      rewrite:
        uri: /
      route:
        - destination:
            host: helloword-api-service.default.svc.cluster.local
            port:
              number: 8000

