apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: giftexchange
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VamsiPothireddy-Dev/k8-infra.git
    targetRevision: HEAD
    path: apps/giftexchange/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
