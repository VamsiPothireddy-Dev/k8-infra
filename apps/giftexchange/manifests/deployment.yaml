---
# Source: services/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: giftexchange-deployment  # Generalized name based on appName from values.yaml
  labels:
    helm.sh/chart: services-0.1.0
    app.kubernetes.io/name: services
    app.kubernetes.io/instance: giftexchange
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: giftexchange  # Use appName from values.yaml
  template:
    metadata:
      labels:
        app: giftexchange  # Use appName from values.yaml
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: giftexchange  # Use appName from values.yaml
        image: "vamsipothireddy/giftexchange:08227f3f64c630016567ff338c81849de60834dc"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5001
        env:
          - name: IMAGE_TAG
            value: "08227f3f64c630016567ff338c81849de60834dc"


