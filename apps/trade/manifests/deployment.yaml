---
# Source: services/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-deployment  # Generalized name based on appName from values.yaml
  labels:
    helm.sh/chart: services-0.1.0
    app.kubernetes.io/name: services
    app.kubernetes.io/instance: trade
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade  # Use appName from values.yaml
  template:
    metadata:
      labels:
        app: trade  # Use appName from values.yaml
        sidecar.istio.io/inject: "true"
    spec:
      containers:
      - name: trade  # Use appName from values.yaml
        image: "vamsipothireddy/trade:sha-0f4985c"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000


