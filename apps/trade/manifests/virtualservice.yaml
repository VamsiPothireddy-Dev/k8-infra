---
# Source: services/templates/virtualservice.yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: trade-virtualservice
spec:
  hosts:
    - "api.vamsipothireddy.com"
  gateways:
    - "istio-system/ingressgateway"
  http:
    - name: default
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: trade-service.default.svc.cluster.local
            port:
              number: 8000

